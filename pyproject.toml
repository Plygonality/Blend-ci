[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blend-ci"
version = "0.1.0"
description = "Headless Blender cook: apply a gn-as-code dump, write a structural scene dump and a workbench PNG, fail CI if the dump drifts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Plygonality" }]
keywords = ["blender", "ci", "geometry-nodes", "tech-art", "headless"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "gn-as-code @ git+https://github.com/Plygonality/gn-as-code.git",
    "unit-canon @ git+https://github.com/Plygonality/Unit-canon.git",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]

[project.scripts]
blend-ci = "blend_ci.cli:main"

[project.urls]
Homepage = "https://github.com/Plygonality/Blend-ci"
gn-as-code = "https://github.com/Plygonality/gn-as-code"
Master-Node = "https://github.com/Plygonality/Master-Node"
Habitat-kit = "https://github.com/Plygonality/Habitat-kit"
Unit-canon = "https://github.com/Plygonality/Unit-canon"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blend_ci = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
